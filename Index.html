<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Usados | Tienda Oficial</title>
    <!-- Librería oficial de EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --primario: #1a1a1a;
            --acento: #007bff;
            --exito: #28a745;
            --alerta: #e67e22;
            --error: #dc3545;
            --fondo: #f4f7f6;
            --blanco: #ffffff;
        }

        body { font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; background: var(--fondo); color: #333; scroll-behavior: smooth; }

        header { 
            background: var(--primario); color: white; padding: 40px 20px; text-align: center;
            border-bottom: 5px solid var(--acento);
        }

        .vitrina-container {
            max-width: 1200px; margin: 40px auto; position: relative; padding: 0 60px;
        }

        .visor { overflow: hidden; border-radius: 15px; min-height: 480px; }

        .grid-productos { 
            display: flex; transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            gap: 20px; padding: 20px 0;
        }

        .tarjeta {
            min-width: 280px; background: var(--blanco); border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden;
            display: flex; flex-direction: column; transition: 0.3s;
        }

        .img-contenedor {
            position: relative; width: 100%; height: 250px; background: #eee;
        }

        .tarjeta img { width: 100%; height: 100%; object-fit: cover; }

        .galeria-nav {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 6px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 20px;
        }

        .punto { width: 10px; height: 10px; background: rgba(255,255,255,0.4); border-radius: 50%; cursor: pointer; }
        .punto.activo { background: white; transform: scale(1.2); }

        .contenido { padding: 20px; text-align: center; flex-grow: 1; }
        .precio { font-size: 1.4rem; font-weight: bold; color: var(--acento); display: block; margin: 10px 0; }
        .badge { font-size: 0.75rem; padding: 5px 12px; border-radius: 50px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .disponible { background: #d4edda; color: #155724; }
        .agotado { background: #f8d7da; color: #721c24; }

        .btn-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: white; border: 2px solid var(--primario);
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
            font-size: 1.2rem; z-index: 10;
        }
        .btn-prev { left: 5px; } .btn-next { right: 5px; }

        .seccion-contacto { background: white; padding: 50px 20px; }
        .btn-seleccionar { 
            background: var(--acento); color: white; border: none; padding: 12px; 
            border-radius: 5px; width: 100%; cursor: pointer; font-weight: bold; 
        }
        .btn-seleccionar:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1>Mis Usados</h1>
        <p>Catálogo Digital Oficial</p>
    </header>

    <div class="vitrina-container">
        <button class="btn-nav btn-prev" onclick="mover(-1)">❮</button>
        <button class="btn-nav btn-next" onclick="mover(1)">❯</button>
        <div class="visor">
            <div id="mensaje-estado" style="text-align: center; padding: 50px;">Cargando productos...</div>
            <div class="grid-productos" id="catalogo"></div>
        </div>
    </div>

    <!-- SECCIÓN DE CONTACTO VÍA EMAILJS -->
    <section class="seccion-contacto" id="pedido-seccion">
        <div style="max-width: 500px; margin: auto;">
            <h2 style="text-align: center;">Hacer Consulta por Correo</h2>
            
            <form id="form-pedido" onsubmit="enviarCorreo(event)" style="display: flex; flex-direction: column; gap: 15px;">
                <!-- Campo para el nombre del cliente -->
                <input type="text" id="cliente-nombre" name="nombre_cliente" placeholder="Tu nombre completo" required style="padding: 12px; border: 1px solid #ccc; border-radius: 5px;">
                
                <!-- Campo para el correo del cliente - -->
                <input type="email" id="cliente-email" name="email_cliente" placeholder="Tu correo electrónico (ej: cliente@gmail.com)" required style="padding: 12px; border: 1px solid #ccc; border-radius: 5px;">
                
                <!-- Detalle del producto e interés -->
                <textarea id="txt-mensaje" name="detalle_pedido" rows="4" placeholder="Selecciona un producto del catálogo..." required style="padding: 12px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
                
                <!-- Botón de envío -->
                <button type="submit" id="btn-enviar" style="background: var(--primario); color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem;">
                    Enviar Pedido a mi Correo
                </button>
            </form>
            
            <p id="mensaje-respuesta" style="text-align: center; font-weight: bold; margin-top: 15px;"></p>
        </div>
    </section>

    <script>
        // ==========================================
        // CONFIGURACIÓN DE EMAILJS (TUS CLAVES)
        // ==========================================
        const PUBLIC_KEY = "6vG6g-_5OuHo7EQwG";
        const SERVICE_ID = "service_vgl5ahr";
        const TEMPLATE_ID = "template_t830p88";

        // Inicializar EmailJS con tu clave pública
        (function() {
            if (PUBLIC_KEY !== "6vG6g-_5OuHo7EQwG") {
                emailjs.init(PUBLIC_KEY);
            }
        })();

        // ==========================================
        // CÓDIGO DE LECTURA DEL CATÁLOGO (GOOGLE SHEETS)
        // ==========================================
        const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS3fcYWk6ira5SgkWGjS5-tVBvFAMPGUS9ggADgr-Wg8OzWRZGU47SehGfNIFc3EA/pub?output=csv";
        let productos = [];
        let scrollPos = 0;

        function convertirLinkDrive(url) {
            if (!url || url.trim().length < 10) return null;
            const cleanUrl = url.trim().replace(/"/g, '');
            let id = "";

            if (cleanUrl.includes("id=")) {
                id = cleanUrl.split("id=")[1].split("&")[0];
            } else if (cleanUrl.includes("/d/")) {
                id = cleanUrl.split("/d/")[1].split("/")[0];
            }

            return id ? `https://lh3.googleusercontent.com/d/${id}` : cleanUrl;
        }

        async function cargarDatos() {
            try {
                const res = await fetch(URL_CSV + "&t=" + new Date().getTime());
                const csv = await res.text();
                const filas = csv.split(/\r?\n/).filter(line => line.trim() !== "");
                
                productos = filas.slice(1).map(f => {
                    const c = f.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    
                    const img1 = convertirLinkDrive(c[2]);
                    const img2 = convertirLinkDrive(c[3]);
                    const img3 = convertirLinkDrive(c[4]);
                    const imgs = [img1, img2, img3].filter(i => i !== null);

                    const stockValue = c[5] ? c[5].trim().replace(/"/g, '') : "0";
                    const stockNum = parseInt(stockValue);

                    return {
                        nombre: c[0]?.replace(/"/g, '').trim(),
                        precio: c[1]?.replace(/"/g, '').trim(),
                        imagenes: imgs.length > 0 ? imgs : ["https://via.placeholder.com/400x300?text=Sin+Imagen"],
                        stock: isNaN(stockNum) ? 0 : stockNum
                    };
                }).filter(p => p.nombre);

                document.getElementById('mensaje-estado').style.display = "none";
                renderizar();
            } catch (e) {
                document.getElementById('mensaje-estado').innerHTML = "Error al conectar con el catálogo.";
            }
        }

        function renderizar() {
            const contenedor = document.getElementById('catalogo');
            contenedor.innerHTML = "";
            productos.forEach((p, i) => {
                const card = document.createElement('div');
                card.className = 'tarjeta';
                card.style.opacity = p.stock <= 0 ? "0.7" : "1";
                
                let puntosHTML = "";
                if (p.imagenes.length > 1) {
                    puntosHTML = `<div class="galeria-nav">` + 
                        p.imagenes.map((_, idx) => `<span class="punto ${idx===0?'activo':''}" onclick="cambiarFoto(${i}, ${idx}, this)"></span>`).join('') + 
                    `</div>`;
                }

                card.innerHTML = `
                    <div class="img-contenedor">
                        <img src="${p.imagenes[0]}" id="foto-${i}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300?text=Cargando...'">
                        ${puntosHTML}
                    </div>
                    <div class="contenido">
                        <span class="badge ${p.stock > 0 ? 'disponible' : 'agotado'}">
                            ${p.stock > 0 ? 'Stock: ' + p.stock : 'Agotado'}
                        </span>
                        <h3>${p.nombre}</h3>
                        <span class="precio">$${p.precio}</span>
                        <button class="btn-seleccionar" onclick="seleccionar('${p.nombre}')" ${p.stock <= 0 ? 'disabled' : ''}>
                            ${p.stock > 0 ? 'Seleccionar' : 'Sin Stock'}
                        </button>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function cambiarFoto(pIdx, imgIdx, el) {
            const imgElement = document.getElementById(`foto-${pIdx}`);
            imgElement.style.opacity = "0.5";
            imgElement.src = productos[pIdx].imagenes[imgIdx];
            imgElement.onload = () => imgElement.style.opacity = "1";
            
            el.parentElement.querySelectorAll('.punto').forEach(p => p.classList.remove('activo'));
            el.classList.add('activo');
        }

        function mover(dir) {
            const ancho = 300;
            const limite = Math.max(0, (productos.length - 1) * ancho);
            scrollPos += (dir * -ancho);
            if (scrollPos < -limite) scrollPos = -limite;
            if (scrollPos > 0) scrollPos = 0;
            document.getElementById('catalogo').style.transform = `translateX(${scrollPos}px)`;
        }

        function seleccionar(nom) {
            document.getElementById('txt-mensaje').value = "Hola Mis Usados, me interesa el producto: " + nom;
            document.getElementById('pedido-seccion').scrollIntoView();
        }

        // ==========================================
        // LÓGICA DE ENVÍO DE CORREO (FUNCIÓN PRINCIPAL)
        // ==========================================
        function enviarCorreo(event) {
            event.preventDefault();

            const btn = document.getElementById('btn-enviar');
            const respuesta = document.getElementById('mensaje-respuesta');

            if (PUBLIC_KEY === "6vG6g-_5OuHo7EQwG") {
                respuesta.style.color = "red";
                respuesta.innerText = "Error: Faltan ingresar las claves de EmailJS en el código.";
                return;
            }

            btn.innerText = "Enviando pedido...";
            btn.disabled = true;

            emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, '#form-pedido')
                .then(() => {
                    btn.innerText = "Enviar Pedido a mi Correo";
                    btn.disabled = false;
                    respuesta.style.color = "var(--exito)";
                    respuesta.innerText = "¡Gracias! Tu consulta ha sido enviada con éxito. Te responderemos pronto.";
                    document.getElementById('form-pedido').reset();
                }, (err) => {
                    btn.innerText = "Enviar Pedido a mi Correo";
                    btn.disabled = false;
                    respuesta.style.color = "var(--error)";
                    respuesta.innerText = "Ocurrió un error al enviar el correo. Por favor, intenta de nuevo.";
                    console.error("Error EmailJS:", err);
                });
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
