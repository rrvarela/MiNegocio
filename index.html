<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Usados | Catálogo Digital</title>
    
    <!-- Librería oficial de EmailJS (SDK Browser v3) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root {
            --primario: #1a1a1a;
            --acento: #007bff;
            --exito: #28a745;
            --error: #dc3545;
            --fondo: #f4f7f6;
            --blanco: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            background: var(--fondo); 
            color: #333; 
        }

        header { 
            background: var(--primario); 
            color: white; 
            padding: 30px 20px; 
            text-align: center; 
            border-bottom: 4px solid var(--acento); 
        }

        .contenedor { 
            max-width: 1100px; 
            margin: 30px auto; 
            padding: 0 20px; 
        }

        .grid-productos { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
            gap: 20px; 
        }

        .tarjeta { 
            background: var(--blanco); 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        .tarjeta img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            background: #eee;
        }

        .contenido { 
            padding: 15px; 
            text-align: center; 
            flex-grow: 1; 
        }

        .precio { 
            font-size: 1.3rem; 
            font-weight: bold; 
            color: var(--acento); 
            margin: 10px 0; 
        }

        .badge { 
            font-size: 0.8rem; 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-weight: bold; 
        }

        .disponible { background: #d4edda; color: #155724; }
        .agotado { background: #f8d7da; color: #721c24; }

        .btn-seleccionar { 
            background: var(--acento); 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 5px; 
            width: 100%; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px;
        }

        .seccion-contacto { 
            background: white; 
            padding: 40px 20px; 
            margin-top: 40px; 
            border-top: 1px solid #ddd;
        }

        form { 
            max-width: 500px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        input, textarea { 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 1rem;
        }

        button[type="submit"] { 
            background: var(--primario); 
            color: white; 
            padding: 14px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mis Usados</h1>
        <p>Catálogo de Productos Disponibles</p>
    </header>

    <div class="contenedor">
        <div id="mensaje-estado" style="text-align: center; font-size: 1.2rem; margin: 40px 0;">
            Cargando productos desde la base de datos...
        </div>
        <div class="grid-productos" id="catalogo"></div>
    </div>

    <!-- Sección de Formulario de Consulta -->
    <section class="seccion-contacto" id="contacto">
        <div style="max-width: 500px; margin: auto;">
            <h2 style="text-align: center;">Consulta por Correo</h2>
            
            <form id="form-pedido" onsubmit="enviarCorreo(event)">
                <input type="text" name="nombre_cliente" placeholder="Tu nombre completo" required>
                <input type="email" name="email_cliente" placeholder="Tu correo electrónico" required>
                <textarea id="txt-mensaje" name="detalle_pedido" rows="4" placeholder="Escribe tu consulta o selecciona un producto..." required></textarea>
                
                <button type="submit" id="btn-enviar">Enviar Consulta</button>
            </form>
            
            <p id="mensaje-respuesta" style="text-align: center; font-weight: bold; margin-top: 15px;"></p>
        </div>
    </section>

    <script>
        // =========================================================================
        // CONFIGURACIÓN DE CREDENCIALES DE EMAILJS
        // Sustituye las cadenas entre comillas por tus datos exactos de EmailJS
        // =========================================================================
        const PUBLIC_KEY = "6vG6g-_5OuHo7EQwG";
        const SERVICE_ID = "service_vgl5ahr";
        const TEMPLATE_ID = "template_zwyzlcu";

        // Inicialización del SDK de EmailJS
        (function() {
            if (PUBLIC_KEY !== "6vG6g-_5OuHo7EQwG" && PUBLIC_KEY.trim() !== "") {
                emailjs.init(PUBLIC_KEY);
                console.log("EmailJS inicializado correctamente.");
            } else {
                console.warn("Advertencia: Configura tu Public Key real en las constantes JavaScript.");
            }
        })();

        // Enlace CSV publicado de Google Sheets
        const URL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS3fcYWk6ira5SgkWGjS5-tVBvFAMPGUS9ggADgr-Wg8OzWRZGU47SehGfNIFc3EA/pub?output=csv";

        // Función para transformar enlaces compartidos de Google Drive en enlaces de imagen directa
        function convertirLinkDrive(url) {
            if (!url || url.trim().length < 10) return null;
            const cleanUrl = url.trim().replace(/"/g, '');
            let id = "";

            if (cleanUrl.includes("id=")) {
                id = cleanUrl.split("id=")[1].split("&")[0];
            } else if (cleanUrl.includes("/d/")) {
                id = cleanUrl.split("/d/")[1].split("/")[0];
            }

            return id ? `https://lh3.googleusercontent.com/d/${id}` : cleanUrl;
        }

        // Cargar productos desde Google Sheets
        async function cargarDatos() {
            try {
                const res = await fetch(URL_CSV + "&t=" + new Date().getTime());
                const csv = await res.text();
                const filas = csv.split(/\r?\n/).filter(line => line.trim() !== "");
                
                const productos = filas.slice(1).map(f => {
                    const c = f.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const imgDirecta = convertirLinkDrive(c[2]);
                    const stockNum = parseInt(c[5] ? c[5].replace(/"/g, '') : "0");

                    return {
                        nombre: c[0]?.replace(/"/g, '').trim(),
                        precio: c[1]?.replace(/"/g, '').trim(),
                        imagen: imgDirecta || "https://via.placeholder.com/300x200?text=Sin+Imagen",
                        stock: isNaN(stockNum) ? 0 : stockNum
                    };
                }).filter(p => p.nombre);

                document.getElementById('mensaje-estado').style.display = "none";
                renderizar(productos);
            } catch (e) {
                document.getElementById('mensaje-estado').innerText = "Error al cargar la lista de productos.";
            }
        }

        // Mostrar productos en pantalla
        function renderizar(productos) {
            const contenedor = document.getElementById('catalogo');
            contenedor.innerHTML = "";

            productos.forEach(p => {
                const card = document.createElement('div');
                card.className = 'tarjeta';
                card.innerHTML = `
                    <img src="${p.imagen}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x200?text=Imagen+No+Disponible'">
                    <div class="contenido">
                        <span class="badge ${p.stock > 0 ? 'disponible' : 'agotado'}">
                            ${p.stock > 0 ? 'Disponible' : 'Agotado'}
                        </span>
                        <h3>${p.nombre}</h3>
                        <div class="precio">$${p.precio}</div>
                        <button class="btn-seleccionar" onclick="seleccionar('${p.nombre}')">Consultar</button>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        // Seleccionar producto y desplazar hacia el formulario
        function seleccionar(nombreProducto) {
            document.getElementById('txt-mensaje').value = "Hola, estoy interesado en el producto: " + nombreProducto;
            document.getElementById('contacto').scrollIntoView({ behavior: 'smooth' });
        }

        // Enviar formulario mediante EmailJS pasándole explícitamente la PUBLIC_KEY
        function enviarCorreo(event) {
            event.preventDefault();

            const btn = document.getElementById('btn-enviar');
            const respuesta = document.getElementById('mensaje-respuesta');

            btn.innerText = "Enviando...";
            btn.disabled = true;

            // Validación de seguridad previa al envío
            if (PUBLIC_KEY === "6vG6g-_5OuHo7EQwG" || SERVICE_ID === "service_vgl5ahr") {
                respuesta.style.color = "var(--error)";
                respuesta.innerText = "Error: Por favor reemplaza las claves de EmailJS en las constantes del código.";
                btn.innerText = "Enviar Consulta";
                btn.disabled = false;
                return;
            }

            // Envío con paso explícito de la clave pública como 4º argumento
            emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, '#form-pedido', PUBLIC_KEY)
                .then((result) => {
                    console.log("Éxito al enviar correo:", result.text);
                    btn.innerText = "Enviar Consulta";
                    btn.disabled = false;
                    respuesta.style.color = "var(--exito)";
                    respuesta.innerText = "¡Consulta enviada con éxito!";
                    document.getElementById('form-pedido').reset();
                })
                .catch((error) => {
                    console.error("Error al enviar mediante EmailJS:", error);
                    btn.innerText = "Enviar Consulta";
                    btn.disabled = false;
                    respuesta.style.color = "var(--error)";
                    const detalle = error.text || error.message || "Error de autenticación";
                    respuesta.innerText = "Error al enviar: " + detalle;
                });
        }

        window.onload = cargarDatos;
    </script>
</body>
</html>
